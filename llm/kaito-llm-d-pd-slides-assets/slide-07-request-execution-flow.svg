<rect x="70.0" y="650.0" width="1180.0" height="220.0" rx="18" ry="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
<text x="660.0" y="744.2" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="400" fill="#111827"><tspan x="660.0" dy="0.0">Gateway / HTTPRoute forwards the user request to the model&#x27;s InferencePool.\nllm-d Router EPP decides whether</tspan><tspan x="660.0" dy="22.5">prefill is needed and picks the role-specific backends.\nDecode remains the coordination point; the client</tspan><tspan x="660.0" dy="22.5">still sees one endpoint.</tspan></text>
<rect x="1360.0" y="650.0" width="770.0" height="220.0" rx="18" ry="18" fill="#EAF2FF" stroke="#2F6FEB" stroke-width="3" />
<text x="1745.0" y="755.5" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="400" fill="#0F2747"><tspan x="1745.0" dy="0.0">Prefill is conditional, not mandatory.\nKV transfer bridges prefill and</tspan><tspan x="1745.0" dy="22.5">decode.\nResponse streaming returns through the decode path.</tspan></text>
