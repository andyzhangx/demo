<text x="490.0" y="391.8" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="400" fill="#111827"><tspan x="490.0" dy="0.0">Decode pods are the final response point for user traffic.\nThe routing</tspan><tspan x="490.0" dy="22.5">sidecar receives the EPP decision, coordinates prefill, waits for KV</tspan><tspan x="490.0" dy="22.5">handoff, then forwards to local vLLM.\nThat keeps the external routing</tspan><tspan x="490.0" dy="22.5">contract stable while hiding the internal P/D choreography behind one decode</tspan><tspan x="490.0" dy="22.5">endpoint.</tspan></text>
