<rect x="80.0" y="140.0" width="860.0" height="600.0" rx="18" ry="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
<text x="510.0" y="413.0" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="400" fill="#111827"><tspan x="510.0" dy="0.0">Decode pods are the final response point for user traffic.\nThe routing sidecar</tspan><tspan x="510.0" dy="22.5">receives the EPP decision, coordinates prefill, waits for KV handoff, then</tspan><tspan x="510.0" dy="22.5">forwards to local vLLM.\nThis keeps the external routing contract stable while</tspan><tspan x="510.0" dy="22.5">hiding the internal P/D choreography behind one decode endpoint.</tspan></text>
<rect x="1020.0" y="260.0" width="210.0" height="90.0" rx="18" ry="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3" />
<text x="1125.0" y="311.8" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="700" fill="#9A3412"><tspan x="1125.0" dy="0.0">from EPP</tspan></text>
<rect x="1330.0" y="250.0" width="600.0" height="130.0" rx="18" ry="18" fill="#EAF2FF" stroke="#2F6FEB" stroke-width="3" />
<text x="1630.0" y="324.0" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F2747"><tspan x="1630.0" dy="0.0">Routing sidecar\nport 5000</tspan></text>
<rect x="1930.0" y="120.0" width="180.0" height="80.0" rx="18" ry="18" fill="#F3E8FF" stroke="#6D28D9" stroke-width="3" />
<text x="2020.0" y="167.5" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="20" font-weight="700" fill="#6D28D9"><tspan x="2020.0" dy="0.0">KV handoff</tspan></text>
<rect x="1330.0" y="520.0" width="600.0" height="130.0" rx="18" ry="18" fill="#E8FFFB" stroke="#0F766E" stroke-width="3" />
<text x="1630.0" y="594.0" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F766E"><tspan x="1630.0" dy="0.0">Local decode vLLM\nport 5001</tspan></text>
<rect x="1510.0" y="420.0" width="240.0" height="70.0" rx="18" ry="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
