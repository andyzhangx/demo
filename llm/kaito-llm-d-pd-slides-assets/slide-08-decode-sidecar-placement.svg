</defs><g class="d2h5"><g class="shape" ><rect x="0" y="0" width="1175" height="98" stroke="#CBD5E1" fill="#FFFFFF" style="stroke-width:2;" /></g><text x="587.5" y="38.5" fill="#000410" class="text-mono-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="587.5" dy="0">DECODE PODS ARE THE FINAL RESPONSE POINT FOR USER TRAFFIC.</tspan><tspan x="587.5" dy="17.666667">THE ROUTING SIDECAR RECEIVES THE EPP DECISION, COORDINATES PREFILL, WAITS FOR KV HANDOFF, THEN FORWARDS TO LOCAL VLLM.</tspan><tspan x="587.5" dy="17.666667">THAT KEEPS THE EXTERNAL ROUTING CONTRACT STABLE WHILE HIDING THE INTERNAL P/D CHOREOGRAPHY BEHIND ONE DECODE ENDPOINT.</tspan></text></g><g class="cG9k"><g class="shape" ><rect x="1295" y="219" width="834" height="152" stroke="#CBD5E1" fill="#F8FAFC" style="stroke-width:2;" /><rect x="1295" y="219" width="834" height="152" class="dots-overlay" style="stroke-width:2;" /><rect x="1300" y="224" width="824" height="142" stroke="#CBD5E1" fill="transparent" style="stroke-width:2;" /></g><text x="1712" y="206" fill="#000410" class="text-mono-bold fill-N1" style="text-anchor:middle;font-size:28px">DECODE POD</text></g><g class="ZXBw"><g class="shape" ><rect x="508" y="204" width="159" height="66" stroke="#FDBA74" fill="#FFF7ED" style="stroke-width:2;" /></g><text x="587.5" y="242.5" fill="#9A3412" class="text-mono-bold" style="text-anchor:middle;font-size:16px">EPP DECISION</text></g><g class="a3Y="><g class="shape" ><rect x="518" y="330" width="140" height="66" stroke="#6D28D9" fill="#F3E8FF" style="stroke-width:2;" /></g><text x="588" y="368.5" fill="#6D28D9" class="text-mono-bold" style="text-anchor:middle;font-size:16px">KV HANDOFF</text></g><g class="cHJveHk="><g class="shape" ><rect x="1614" y="25" width="178" height="66" stroke="#000410" fill="#FFFFFF" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1703" y="63.5" fill="#000410" class="text-mono-bold fill-N1" style="text-anchor:middle;font-size:16px">PROXY TO LOCAL</text></g><g class="cmVzdWx0"><g class="shape" ></g><text x="2540.5" y="297" fill="#000410" class="text-mono-bold fill-N1" style="text-anchor:middle;font-size:18px">DECODE POD = COORDINATION POINT + FINAL RESPONSE POINT</text></g><g class="cG9kLnNpZGVjYXI="><g class="shape" ><rect x="1325" y="259" width="189" height="82" stroke="#2F6FEB" fill="#EAF2FF" style="stroke-width:2;" /></g><text x="1419.5" y="297.5" fill="#0F2747" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="1419.5" dy="0">ROUTING SIDECAR</tspan><tspan x="1419.5" dy="18.5">PORT 5000</tspan></text></g><g class="cG9kLnZsbG0="><g class="shape" ><rect x="1892" y="249" width="207" height="82" stroke="#0F766E" fill="#E8FFFB" style="stroke-width:2;" /></g><text x="1995.5" y="287.5" fill="#0F766E" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="1995.5" dy="0">LOCAL DECODE VLLM</tspan><tspan x="1995.5" dy="18.5">PORT 5001</tspan></text></g><g class="KGVwcCAtJmd0OyBwb2Quc2lkZWNhcilbMF0="><marker id="mk-d2-1857249693-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000410" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 669 237 C 1113.400024 237 1285 241.399994 1321.33874 257.389045" stroke="#000410" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1857249693-3488378134)" mask="url(#d2-1857249693)" /></g><g class="KGt2IC0mZ3Q7IHBvZC5zaWRlY2FyKVswXQ=="><marker id="mk-d2-1857249693-3290281597" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#6D28D9" class="connection" stroke-width="2" /> </marker><path d="M 660.5 363 C 1111.699951 363 1285 358.600006 1321.33874 342.610955" stroke="#6D28D9" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="