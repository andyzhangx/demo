<text x="1680.0" y="871.8" text-anchor="middle" font-family="Aptos, Arial, sans-serif" font-size="18" font-weight="400" fill="#111827"><tspan x="1680.0" dy="0.0">decode pod = coordination point + final response point</tspan></text>
