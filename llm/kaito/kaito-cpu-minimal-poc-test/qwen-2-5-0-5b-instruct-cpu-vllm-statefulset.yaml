apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qwen-2-5-0-5b-instruct-cpu-vllm-w9nhb
  namespace: default
  annotations:
    workspace.kaito.io/revision: "1"
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      inferenceset.kaito.sh/created-by: qwen-2-5-0-5b-instruct-cpu-vllm
      kaito.sh/workspace: qwen-2-5-0-5b-instruct-cpu-vllm-w9nhb
  serviceName: qwen-2-5-0-5b-instruct-cpu-vllm-w9nhb-headless
  template:
    metadata:
      labels:
        inferenceset.kaito.sh/created-by: qwen-2-5-0-5b-instruct-cpu-vllm
        kaito.sh/workspace: qwen-2-5-0-5b-instruct-cpu-vllm-w9nhb
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: apps
                    operator: In
                    values:
                      - qwen-2-5-0-5b-instruct-cpu-vllm
                  - key: kaito.sh/workspace
                    operator: In
                    values:
                      - qwen-2-5-0-5b-instruct-cpu-vllm-w9nhb
                  - key: kaito.sh/workspacenamespace
                    operator: In
                    values:
                      - default
      containers:
        - name: qwen-2-5-0-5b-instruct-cpu-vllm-w9nhb
          image: andyzhangx/kaito-base-vllm-cpu:0.3.0
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - >-
              python3 /workspace/vllm/inference_api.py --model=qwen/qwen2.5-0.5b-instruct
              --download-dir=/workspace/weights --config_format=auto --load_format=auto
              --tool-call-parser=hermes --enable-auto-tool-choice
              --chat-template=/workspace/chat_templates/tool-chat-hermes.jinja
              --kv-events-config='{"enable_kv_cache_events":true}'
              --compilation-config.pass_config.fuse_allreduce_rms=False --tokenizer_mode=auto
              --trust-remote-code --dtype=bfloat16
              --served-model-name=qwen-2-5-0-5b-instruct-cpu-vllm --max-model-len=2048
          env:
            - name: VLLM_USE_FLASHINFER_SAMPLER
              value: "0"
            - name: VLLM_USE_DEEP_GEMM
              value: "0"
            - name: VLLM_WSL2_ENABLE_PIN_MEMORY
              value: "1"
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 5000
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 5000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 180
            httpGet:
              path: /health
              port: 5000
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /workspace/weights
              name: model-weights-volume
            - mountPath: /dev/shm
              name: dshm
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: model-weights-volume
          emptyDir: {}
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
